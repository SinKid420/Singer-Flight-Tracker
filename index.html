<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Overhead</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0e10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sky Overhead">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed map, floating search-style pill and map-style chips on top, white bottom sheet below. One phone screen, no page scroll. */
:root{
  --bg:#0e0e10; --chip:#1e1e22; --line:#34343a; --fg:#f4f4f5; --dim:#a1a1aa;
  --accent:#ff3b30; --accent-bg:#3a1512; --good:#34c759; --bad:#ff8a80;
  --font:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --shadow:0 1px 8px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.35 var(--font)}
.app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mapwrap{position:relative;flex:1 1 auto;min-height:0;display:flex}
#map{flex:1 1 auto;min-width:0;overflow:hidden;position:relative;background:#e5e3df}
#map.sat{background:#0b1520}
.leaflet-container{font-family:var(--font)}
button,select{font:500 13px var(--font);color:var(--fg);background:var(--bg);border:0;border-radius:8px;padding:6px 8px}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* floating pill at the top, like the Google Maps search bar */
.pill{position:absolute;z-index:700;top:16px;left:max(16px,env(safe-area-inset-left,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 82px);
  display:flex;align-items:center;gap:6px;height:48px;padding:0 6px 0 16px;background:var(--bg);border-radius:24px;box-shadow:var(--shadow);min-width:0}
h1{font:500 16px/1 var(--font);margin:0;white-space:nowrap;color:var(--fg)}
h1 b{color:var(--accent);font-weight:500}
.stat{font-size:11px;line-height:1.25;color:var(--dim);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.stat em{font-style:normal;color:var(--fg);font-weight:500}
.stat .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.stat .live.err{background:var(--bad)}
.pill select{background:var(--chip);border-radius:16px;padding:7px 6px;font-size:12px}
.icon-btn{width:36px;height:36px;border-radius:50%;padding:0;display:grid;place-items:center;color:var(--accent);background:var(--bg)}
.icon-btn:hover{background:var(--accent-bg)}

/* map-style chips */
.chips{position:absolute;z-index:700;top:72px;left:max(16px,env(safe-area-inset-left,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 82px);display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
.chips>*{pointer-events:auto}
.seg{display:flex;background:var(--bg);border-radius:18px;box-shadow:var(--shadow);padding:2px}
.seg button{border-radius:16px;padding:8px 10px;min-height:36px;font-size:12px;color:var(--dim);background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent)}
.refresh{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:18px;box-shadow:var(--shadow);padding:2px 2px 2px 10px;font-size:11px;color:var(--dim)}
.refresh select{background:var(--chip);border-radius:16px;padding:8px 6px;font-size:12px}

/* legend and zoom */
.legends{position:absolute;z-index:700;left:max(10px,env(safe-area-inset-left,0px));right:64px;bottom:36px;display:flex;gap:6px;align-items:flex-end;pointer-events:none}
.legend{background:rgba(14,14,16,.88);border-radius:8px;box-shadow:var(--shadow);padding:5px 8px;font-size:10px;color:var(--dim)}
.wxlegend img{display:block;max-height:110px;max-width:100px;margin-top:3px}
.wxlegend div{white-space:nowrap}
.wxlegend{pointer-events:auto}
.cloudblend{mix-blend-mode:screen}
body.zooming .lbl,body.far .lbl{display:none}
body.zooming .glide .leaflet-marker-icon{transition:none}
[hidden]{display:none!important}
.stat{cursor:pointer}
.sheet-bg{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:100%;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font:500 18px var(--font);margin-bottom:6px}
.flist{display:flex;flex-direction:column;gap:6px}
.frow{background:var(--chip);border-radius:8px;padding:8px 10px;font-size:13px}
.frow b{display:flex;justify-content:space-between;font-weight:500}
.frow span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.frow .rb{display:none}
.frow .ok{color:var(--good)} .frow .no{color:var(--bad)}
.fhelp{font-size:12px;color:var(--dim);margin:8px 0}
.frelay{display:block;font-size:12px;color:var(--dim)}
.frelay a{color:var(--accent);margin-left:6px}
.frelay input{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:400 14px var(--font);color:var(--fg);background:var(--bg)}
.sheet .links a{text-decoration:none;cursor:pointer}
.bar{width:104px;height:6px;border-radius:3px;margin:3px 0 1px;background:linear-gradient(90deg,#0f9d58,#f4b400,#f57c00,#d93025,#7b1fa2)}
.legend .ends{display:flex;justify-content:space-between}
.leaflet-bar{border:0!important;border-radius:8px;box-shadow:var(--shadow)!important;overflow:hidden}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;font-size:22px;color:var(--fg)!important;background-color:var(--bg)!important;border-bottom-color:var(--line)!important}
.leaflet-bar a:hover{background-color:var(--chip)!important}
.leaflet-control-zoom{margin-right:max(10px,env(safe-area-inset-right,0px))!important;margin-bottom:6px!important}
.leaflet-control-attribution{font-size:9px!important;max-width:100vw;background:rgba(14,14,16,.78)!important;color:#c4c4cc!important}
.leaflet-control-attribution a{color:#ff8a80!important}

/* planes and labels */
.plane{transition:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55))}
.glide .leaflet-marker-icon{transition:transform var(--glide,1s) linear}
#map{--lf:#111214;--ld:#3c4043;--lh:#ffffff}
#map.sat{--lf:#ffffff;--ld:#ffffff;--lh:#000000}
#map.night{--lf:#ffffff;--ld:#e8eaed;--lh:#000000;background:#14161a}
#map.night:not(.sat) .basel{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.85)}
#map.night.sat .basel{filter:brightness(.55) saturate(.9)}
#map .basel{transition:filter .4s}
.lbl{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none;white-space:nowrap;line-height:1.15;
  paint-order:stroke fill;-webkit-text-stroke:3.5px var(--lh);text-shadow:0 0 4px var(--lh),0 0 6px var(--lh)}
.lbl b{display:block;font:700 13px var(--font);color:var(--lf)}
.lbl i{display:block;font:500 12px var(--font);color:var(--ld);font-style:normal;font-variant-numeric:tabular-nums}
.lbl.sel b{color:#d32f2f}
#map.sat .lbl.sel b{color:#ff8a80}
.nolabels .lbl:not(.sel){display:none}

/* bottom sheet */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:1500;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.6);
  padding:8px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.dock::before{content:"";display:block;width:32px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.cs{font:500 24px/1.1 var(--font);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{width:40px;height:40px;border-radius:50%;padding:0;background:var(--chip);color:var(--dim)}
.meta{grid-column:1/-1;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:2px}
.grid div{background:var(--chip);border-radius:8px;padding:5px 8px;min-width:0}
.grid small{display:block;font-size:10px;color:var(--dim)}
.grid span{font:500 14px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.links{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
.links a{flex:1;text-align:center;font:500 13px var(--font);color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:8px 4px;text-decoration:none}
.links a.alt{background:var(--bg);color:var(--accent);border-color:var(--line)}
.listhead{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:4px}
.list{display:flex;flex-direction:column;gap:2px;max-height:140px;overflow-y:auto}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 78px 58px;gap:6px;align-items:center;
  background:var(--bg);border-radius:8px;padding:9px 6px;min-height:44px;text-align:left;font-weight:400;width:100%;border-bottom:1px solid var(--chip)}
.row:hover{background:var(--chip)}
.row b{color:var(--accent);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.row span:nth-child(3),.row span:nth-child(4){text-align:right}
.mk{cursor:pointer}
.welcome{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:1200;width:min(300px,calc(100% - 64px));box-sizing:border-box;text-align:center;padding:16px 16px 14px;border-radius:16px;background:rgba(14,14,16,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 24px rgba(0,0,0,.5);color:var(--fg)}
.welcome b{display:block;font:600 16px var(--font);margin-bottom:6px}
.welcome p{margin:0 0 12px;font-size:13px;line-height:1.4;color:var(--dim)}
.welcome button{min-height:44px;padding:0 20px;border-radius:22px;background:var(--accent);color:#fff;font:600 14px var(--font);border:0;cursor:pointer}
.welcome.soft{top:56%;width:min(280px,calc(100% - 140px));padding:12px 14px}
.welcome.soft button{display:none}
.welcome.soft p{margin:0}
body:has(#fsheet:not([hidden])) .welcome{display:none}
.sheet.fopen>.setrow{display:none}
.apchip{position:absolute;transform:translate(-50%,-50%);font:700 11px/1 var(--font);color:#fff;padding:3px 6px;border-radius:10px;border:1.5px solid #fff;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.55);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.lbl b,.lbl i{max-width:104px;overflow:hidden;text-overflow:ellipsis}
.folder .frow{background:var(--bg)}
.folder .fhelp{margin:8px 6px}
.folder .frelay{margin:0 6px 8px}
.folder .links{margin:0 6px}
.wxlegend{order:-1}
.legends{bottom:46px}
.tempctl{width:72px;height:72px;border-radius:50%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;margin:0 16px 8px 0!important;pointer-events:auto;
  background:rgba(18,18,22,.42);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  border:1px solid rgba(255,255,255,.3);box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.tempctl b{font:700 24px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tempctl span{font:500 10px/1 var(--font);letter-spacing:.03em;opacity:.9}
.leaflet-control-zoom{margin-right:16px!important}
body.moving .tempctl{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(18,18,22,.72)}
.me{pointer-events:none}
.me i{display:block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff 0 4px,#ff3b30 4.5px 9px,rgba(255,59,48,.24) 9.5px 17px,transparent 17.5px)}
.leaflet-marker-icon.me{transition:none!important}
body.moving .compass,body.moving .hdg{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(18,18,22,.72)}
.gear{width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;color:var(--dim);background:var(--bg);box-shadow:var(--shadow)}
.subh{font:500 12px var(--font);color:var(--dim);margin:12px 0 6px;letter-spacing:.04em;text-transform:uppercase}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border-radius:8px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:14px}
.setrow select{background:var(--bg);border-radius:16px;padding:9px 10px;min-height:40px;font-size:14px}
/* compass: glass dial, top-right */
.compass{position:absolute;z-index:700;top:16px;right:max(16px,env(safe-area-inset-right,0px));width:72px;height:72px;border-radius:50%;padding:0;color:#fff;
  background:rgba(18,18,22,.42);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  border:1px solid rgba(255,255,255,.3);box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.compass svg{display:block;width:100%;height:100%;overflow:visible}
.compass text{font:700 10px var(--font);fill:#fff;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:2px}
.compass .north{fill:#ff3b30}
.compass .tick{stroke:rgba(255,255,255,.65);stroke-width:1;stroke-linecap:round}
.hdg{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:5px;min-width:44px;text-align:center;padding:3px 8px;border-radius:12px;font:500 11px/1.1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:#fff;
  background:rgba(18,18,22,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22)}
.compass:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.folder{background:var(--chip);border-radius:8px;margin-bottom:6px;padding:0 6px 6px}
.folder summary{cursor:pointer;list-style:none;font-size:14px;font-weight:500;padding:12px 6px;min-height:44px;display:flex;align-items:center;justify-content:space-between}
.folder summary::-webkit-details-marker{display:none}
.folder summary::after{content:'›';font-size:20px;color:var(--dim);transform:rotate(90deg);transition:transform .2s}
.folder[open] summary::after{transform:rotate(-90deg)}
.folder .setrow{background:var(--bg)}
.folder .setrow select{background:var(--chip)}
.setbtn{width:100%;min-height:44px;border-radius:8px;background:var(--bg);color:var(--accent);font-weight:500;font-size:14px;margin-top:2px}
.ph{grid-column:2;grid-row:2/4;position:relative;display:block;width:104px;height:60px;border-radius:8px;overflow:hidden;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph i{position:absolute;left:0;right:0;bottom:0;padding:8px 4px 2px;font:400 8px/1.1 var(--font);font-style:normal;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hasph .m1{grid-column:1}
#q{display:block;width:100%;height:42px;border:0;border-radius:21px;background:var(--chip);color:var(--fg);padding:0 16px;margin-bottom:6px;font:400 14px var(--font)}
#q::placeholder{color:var(--dim)}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{color:var(--dim);font-size:13px;padding:6px 0}
@media (prefers-reduced-motion:reduce){.plane,.glide .leaflet-marker-icon{transition:none}}
@media (max-width:400px){.seg button{padding:6px 8px}h1{font-size:15px}.pill{padding-left:12px;gap:4px}.stat{font-size:10px}}
@media (max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap">
    <div id="map" role="application" aria-label="Live flight map"></div>
    <div class="pill">
      <h1>Sky<b>Overhead</b></h1>
      <div class="stat" id="stat" role="button" tabindex="0" aria-label="Feed status and settings"><i class="live" id="dot"></i>Loading…</div>
      <button class="icon-btn" id="locate" aria-label="Use my location"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.9 3A9 9 0 0013 3.1V1h-2v2.1A9 9 0 003.1 11H1v2h2.1A9 9 0 0011 20.9V23h2v-2.1a9 9 0 007.9-7.9H23v-2h-2.1zM12 19a7 7 0 110-14 7 7 0 010 14z"/></svg></button>
    </div>
    <div class="chips">
      <div class="seg" role="group" aria-label="Map style">
        <button data-b="map" aria-pressed="true">Map</button><button data-b="sat" aria-pressed="false">Satellite</button><button data-b="terrain" aria-pressed="false">Terrain</button>
      </div>
      <button class="gear" id="gear" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 000-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 00-1.7-1L15 3.3h-4l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 000 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z" transform="translate(-1 0)"/></svg></button>
    </div>
    <div class="legends">
      <div class="legend" id="altlegend"><span id="lgtitle">Altitude ft</span><div class="bar"></div><div class="ends"><span>0</span><span id="lgmax">40k+</span></div></div>
      <div class="legend wxlegend" id="wxlegend"><div id="wxlegtxt">Live rain, mm/h</div><img id="wxlegimg" alt="Rain intensity scale"></div>
    </div>
    <button class="compass" id="compass" aria-label="Compass. Tap to point the map north">
      <svg viewBox="0 0 72 72" aria-hidden="true"><g id="dial">
        <line class="tick" x1="36" y1="3.5" x2="36" y2="7"/><line class="tick" x1="36" y1="68.5" x2="36" y2="65"/><line class="tick" x1="3.5" y1="36" x2="7" y2="36"/><line class="tick" x1="68.5" y1="36" x2="65" y2="36"/>
        <line class="tick" x1="52.25" y1="7.8" x2="50.5" y2="10.8"/><line class="tick" x1="64.2" y1="19.75" x2="61.2" y2="21.5"/><line class="tick" x1="64.2" y1="52.25" x2="61.2" y2="50.5"/><line class="tick" x1="52.25" y1="64.2" x2="50.5" y2="61.2"/>
        <line class="tick" x1="19.75" y1="64.2" x2="21.5" y2="61.2"/><line class="tick" x1="7.8" y1="52.25" x2="10.8" y2="50.5"/><line class="tick" x1="7.8" y1="19.75" x2="10.8" y2="21.5"/><line class="tick" x1="19.75" y1="7.8" x2="21.5" y2="10.8"/>
        <text class="north" x="36" y="17">N</text><text x="55" y="36">E</text><text x="36" y="55">S</text><text x="17" y="36">W</text>
      </g><path d="M36 25.5c.9 0 1.4 1 1.4 2.2v4.6l5.8 3.5v1.6l-5.8-1.7v3.4l1.7 1.3v1.1L36 40.7l-3.1.8v-1.1l1.7-1.3v-3.4l-5.8 1.7v-1.6l5.8-3.5v-4.6c0-1.2.5-2.2 1.4-2.2z" fill="#fff" stroke="rgba(0,0,0,.5)" stroke-width=".8" stroke-linejoin="round"/></svg>
      <span class="hdg" id="hdg">000°</span>
    </button>
  </div>
  <div class="welcome" id="welcome" hidden><b id="wtitle"></b><p id="wtext"></p><button type="button" id="wbtn"></button></div>
  <div class="dock" id="dock" hidden>
    <div id="dbody"></div>
  </div>
</div>
<div class="sheet-bg" id="fsheet" hidden>
  <div class="sheet" role="dialog" aria-label="Settings">
    <div class="sheet-head"><b>Settings</b><button class="close" id="fclose" aria-label="Close">✕</button></div>
    <label class="setrow" for="radius">Search radius<select id="radius" aria-label="Search radius"><option value="0">25 nm</option><option value="1">50 nm</option><option value="2" selected>100 nm</option><option value="3">150 nm</option></select></label>
    <label class="setrow" for="rate">Refresh rate<select id="rate" aria-label="Refresh rate"><option value="2000">2 sec</option><option value="3000">3 sec</option><option value="5000">5 sec</option><option value="10000">10 sec</option><option value="30000">30 sec</option></select></label>
    <label class="setrow" for="units">Units<select id="units" aria-label="Units"><option value="av">ft · kt · nm</option><option value="metric">m · km/h · km</option></select></label>
    <label class="setrow" for="lgwx">Rain key<select id="lgwx" aria-label="Rain key"><option value="1">Show</option><option value="0">Hide</option></select></label>
    <label class="setrow" for="lgalt">Altitude key<select id="lgalt" aria-label="Altitude key"><option value="1">Show</option><option value="0">Hide</option></select></label>
    <label class="setrow" for="ctemp">Temperature<select id="ctemp" aria-label="Temperature widget"><option value="C">°C</option><option value="F">°F</option><option value="off">Hide</option></select></label>
    <details class="folder" id="rfolder"><summary>Map options</summary>
      <label class="setrow" for="maptheme">Map theme<select id="maptheme" aria-label="Map theme"><option value="day">Day</option><option value="night">Night</option><option value="auto">Auto (sunset)</option></select></label>
      <label class="setrow" for="radsrc">Radar source<select id="radsrc" aria-label="Radar source"><option value="auto">All (CA · US · MX)</option><option value="ca">Canada only</option><option value="us">US only</option><option value="mx">Mexico + world</option><option value="off">Off</option></select></label>
      <label class="setrow" for="radloop">Animation<select id="radloop" aria-label="Radar animation"><option value="1">Play last hour</option><option value="0">Off (live only)</option></select></label>
      <label class="setrow" for="routemode">Route lines<select id="routemode" aria-label="Route lines"><option value="all">All planes</option><option value="sel">Selected only</option><option value="off">Hide</option></select></label>
      <label class="setrow" for="maxpl">Planes shown<select id="maxpl" aria-label="Planes shown"><option value="15">Closest 15</option><option value="30">Closest 30</option><option value="50">Closest 50</option><option value="100">Closest 100</option><option value="150">Closest 150</option></select></label>
    </details>
    <details class="folder" id="cfolder"><summary>Compass</summary>
      <label class="setrow" for="cread">Heading readout<select id="cread" aria-label="Heading readout"><option value="1">Show</option><option value="0">Hide</option></select></label>
      <label class="setrow" for="cshow">Compass dial<select id="cshow" aria-label="Compass dial"><option value="1">Show</option><option value="0">Hide</option></select></label>
      <label class="setrow" for="cspin">Needle smoothing<select id="cspin" aria-label="Needle smoothing"><option value="55">Smooth</option><option value="25">Quick</option><option value="1">Off</option></select></label>
      <button class="setbtn" id="cnorth" type="button">Point map north</button>
      <div class="subh" style="margin-top:8px;text-transform:none;letter-spacing:0">Tap the dial to point north. Turn the map with two fingers.</div>
    </details>
    <details class="folder" id="ffolder"><summary>Flight feeds &amp; key</summary>
    <div id="flist" class="flist"></div>
    <p class="fhelp" id="fhelp"></p>
    <p class="fhelp" id="fenv"></p>
    <label class="frelay" for="apikey">FlyItalyADSB key (free) <a href="https://flyitalyadsb.com/en/data/api/#api-key" target="_blank" rel="noopener">Get a key</a><input id="apikey" type="password" autocomplete="off" placeholder="Paste your key"></label>
    <label class="frelay" for="relay" style="margin-top:8px">Relay address (optional)<input id="relay" type="url" inputmode="url" placeholder="https://your-relay.workers.dev/"></label>
    <div class="links"><a href="#" id="ftest" role="button">Test feeds</a><a href="#" class="alt" id="fsave" role="button">Save</a></div>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script>
if(typeof L==='undefined'){document.addEventListener('DOMContentLoaded',function(){document.getElementById('stat').textContent='Map library blocked. Reload with a connection.'})}
(function(){
  if(typeof L==='undefined') return;
  // Default: Grand Forks, BC. Replaced by your GPS position if the browser allows it.
  var me = {lat:49.0306, lon:-118.4448, label:'Grand Forks'};
  var refreshMs = 3000, timer = null, busy = false, radiusNm = 100, selected = null, planes = {}, trails = {}, lastData = [], failCount = 0;
  // Independent volunteer ADS-B networks. Each returns the same readsb-style JSON; results are merged by aircraft id.
  // FlyItalyADSB allows web pages to read it (free personal key). The others work only through a relay.
  var SOURCES = [
    {id:'FlyItalyADSB',needsKey:true,url:function(a,b,r){return 'https://api.flyitalyadsb.com/api/aircraft/v2/lat/'+a+'/lon/'+b+'/dist/'+r}},
    {id:'adsb.lol',url:function(a,b,r){return 'https://api.adsb.lol/v2/point/'+a+'/'+b+'/'+r}},
    {id:'adsb.fi',url:function(a,b,r){return 'https://opendata.adsb.fi/api/v2/lat/'+a+'/lon/'+b+'/dist/'+r}},
    {id:'adsb.one',url:function(a,b,r){return 'https://api.adsb.one/v2/point/'+a+'/'+b+'/'+r}},
    {id:'airplanes.live',url:function(a,b,r){return 'https://api.airplanes.live/v2/point/'+a+'/'+b+'/'+r}}
  ];
  var src = 0;

  L.GridLayer.prototype.options.keepBuffer=2; L.GridLayer.prototype.options.updateInterval=100;
  var map = L.map('map',{zoomControl:false,attributionControl:true,maxZoom:19,minZoom:4,preferCanvas:true,rotate:true,bearing:0,touchRotate:true,shiftKeyRotate:true,rotateControl:false}).setView([me.lat,me.lon],8);
  map.attributionControl.setPrefix(false);
  var tempEl=null, tempC=null, tcfg='C';
  try{var tv=localStorage.getItem('sky-temp'); if(tv==='F'||tv==='off') tcfg=tv}catch(e){}
  var TempCtl=L.Control.extend({options:{position:'bottomright'},onAdd:function(){var d=L.DomUtil.create('div','tempctl');d.setAttribute('aria-label','Current temperature');d.innerHTML='<b id="tval">--°</b><span id="tcap">now</span>';L.DomEvent.disableClickPropagation(d);tempEl=d;d.hidden=tcfg==='off';return d}});
  new TempCtl().addTo(map);
  function showTemp(){var v=document.getElementById('tval'),c=document.getElementById('tcap'); if(!v||!tempEl) return; tempEl.hidden=tcfg==='off'; if(tempC==null){v.textContent='--°';c.textContent='now';return} var t=tcfg==='F'?tempC*9/5+32:tempC; v.textContent=Math.round(t)+'°'; c.textContent=tcfg==='F'?'°F now':'°C now'}
  function loadTemp(){ if(tcfg==='off') return; fetch('https://api.open-meteo.com/v1/forecast?latitude='+me.lat.toFixed(3)+'&longitude='+me.lon.toFixed(3)+'&current=temperature_2m').then(function(r){return r.json()}).then(function(j){ if(j&&j.current&&typeof j.current.temperature_2m==='number'){tempC=j.current.temperature_2m;showTemp()} }).catch(function(){}) }
  setTimeout(function(){var sel=document.getElementById('ctemp'); if(sel){sel.value=tcfg; sel.onchange=function(){tcfg=sel.value;try{localStorage.setItem('sky-temp',tcfg)}catch(e){} showTemp(); if(tempC==null) loadTemp()}} showTemp(); loadTemp()},0);
  setInterval(loadTemp,600000);
  (function(){
    var K='sky-keys', cfg={lgwx:'1',lgalt:'1'}, els={lgwx:document.getElementById('wxlegend'),lgalt:document.getElementById('altlegend')};
    try{var r=JSON.parse(localStorage.getItem(K)||'{}');for(var k in cfg) if(r[k]!=null) cfg[k]=String(r[k])}catch(e){}
    Object.keys(cfg).forEach(function(id){
      var sel=document.getElementById(id); els[id].hidden=cfg[id]==='0'; sel.value=cfg[id];
      sel.onchange=function(){cfg[id]=sel.value;els[id].hidden=sel.value==='0';try{localStorage.setItem(K,JSON.stringify(cfg))}catch(e){}};
    });
  })();
  L.control.zoom({position:'bottomright'}).addTo(map);

  // Free tile sets that look like Google Maps. Real Google tiles need a paid key and are not allowed here.
  var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
  var BASES={
    map:{sat:false,layers:function(){return [L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19,maxNativeZoom:19,attribution:'Map © OpenStreetMap contributors · ADS-B: FlyItalyADSB (CC BY-SA 4.0), adsb.lol, adsb.fi · Photos: Planespotters.net'})]}},
    sat:{sat:true,layers:function(){return [
      L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:17,attribution:'Imagery © Esri, Maxar, Earthstar · ADS-B: FlyItalyADSB (CC BY-SA 4.0), adsb.lol, adsb.fi · Photos: Planespotters.net'}),
      L.tileLayer(ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:17})]}},
    terrain:{sat:false,layers:function(){return [L.tileLayer(ESRI+'World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:19,maxNativeZoom:17,attribution:'Map © Esri, USGS, NOAA · ADS-B: FlyItalyADSB (CC BY-SA 4.0), adsb.lol, adsb.fi · Photos: Planespotters.net'})]}}
  };
  var baseLayers=[], baseKey='map';
  function setBase(key){
    if(!BASES[key]) key='map';
    baseLayers.forEach(function(l){map.removeLayer(l)});
    baseLayers=BASES[key].layers();
    baseLayers.forEach(function(l){l.addTo(map)});
    baseKey=key; if(baseLayers[0]&&baseLayers[0].getContainer) baseLayers[0].getContainer().classList.add('basel');
    document.getElementById('map').classList.toggle('sat',BASES[key].sat);
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){
      b.setAttribute('aria-pressed',b.getAttribute('data-b')===key?'true':'false');
    });
    try{localStorage.setItem('sky-base',key)}catch(e){}
  }
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){
    b.onclick=function(){setBase(b.getAttribute('data-b'))};
  });
  var savedBase='map'; try{savedBase=localStorage.getItem('sky-base')||'map'}catch(e){}
  setBase(savedBase);

  // Weather overlays from Environment and Climate Change Canada (GeoMet WMS, no key). Without a TIME value the server returns the latest frame.
  var GEOMET='https://geo.weather.gc.ca/geomet';
  var WX={
    rain:{layer:'RADAR_1KM_RRAI',opacity:.75,z:6,label:'Rain, mm/h',legend:GEOMET+'?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=RADAR_1KM_RRAI&format=image/png&STYLE=RADARURPPRECIPR14-LINEAR'},
    snow:{layer:'RADAR_1KM_RSNO',opacity:.75,z:7,label:'Snow, cm/h',legend:GEOMET+'?version=1.3.0&service=WMS&request=GetLegendGraphic&sld_version=1.1.0&layer=RADAR_1KM_RSNO&format=image/png'},
    cloud:{layer:'GOES-West_1km_NaturalColor',boost:1.8,blend:true,z:5,label:'Clouds (daytime)',legend:''}
  };
  // Weather is always on and read-only: rain, snow and cloud layers update by themselves.
  var wxLayers={}, wxOpacity=.5;
  function wxOp(k){return Math.min(1,wxOpacity*(WX[k].boost||1))}
  ['cloud','rain','snow'].forEach(function(k){
    var w=WX[k];
    wxLayers[k]=L.tileLayer.wms(GEOMET,{layers:w.layer,format:'image/png',transparent:true,version:'1.3.0',opacity:wxOp(k),zIndex:w.z,className:w.blend?'cloudblend':'',attribution:'Weather © Environment and Climate Change Canada'}).addTo(map);
  });
  (function(){var img=document.getElementById('wxlegimg');img.onerror=function(){img.hidden=true};img.src=WX.rain.legend})();
  // New frames arrive every 6 to 10 minutes. A changing parameter makes the browser fetch fresh tiles.
  function refreshWx(){Object.keys(wxLayers).forEach(function(k){wxLayers[k].setParams({_ts:Date.now()})})}
  setInterval(refreshWx,300000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden) refreshWx()});
  // ---- Wider radar: US (NEXRAD, Iowa Mesonet) + Canada/US/Mexico/world (RainViewer), animated, no keys
  var IEM='https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913';
  var RVHOST='https://tilecache.rainviewer.com', rvPaths=[], rvStamp=0;
  var rcfg={src:'auto',loop:'1'};
  try{var rr=JSON.parse(localStorage.getItem('sky-radar')||'{}'); if(rr.src) rcfg.src=rr.src; if(rr.loop!=null) rcfg.loop=String(rr.loop)}catch(e){}
  var RSTEPS=6, frames=[], cur=0, tmr=null, radOp=.62, wxTxt=document.getElementById('wxlegtxt'), baseTxt=wxTxt?wxTxt.textContent:'';
  function want(k){ var v=rcfg.src; return v==='auto'||v===k }
  function mk(url,z,nat,attr){ return L.tileLayer(url,{opacity:0,zIndex:z,maxNativeZoom:nat,maxZoom:19,keepBuffer:1,updateWhenIdle:true,attribution:attr}) }
  function clearFrames(){ frames.forEach(function(f){ ['rv','iem'].forEach(function(k){ if(f[k]) map.removeLayer(f[k]) }) }); frames=[] }
  function buildFrame(st){ // st = steps of 10 minutes back from now
    var f={st:st}, b=Math.floor(Date.now()/300000);
    if(want('mx')&&rvPaths.length>st){ f.rv=mk(RVHOST+rvPaths[rvPaths.length-1-st]+'/256/{z}/{x}/{y}/2/1_1.png',4,7,'Radar: RainViewer'); f.rv.addTo(map) }
    if(want('us')){ f.iem=mk(IEM+(st?'-m'+(st*10<10?'0':'')+(st*10)+'m':'')+'/{z}/{x}/{y}.png?b='+b,5,10,'NOAA/IEM'); f.iem.addTo(map) }
    return f }
  function setFrame(i){ cur=i; frames.forEach(function(f,j){ ['rv','iem'].forEach(function(k){ if(f[k]) f[k].setOpacity(j===i?radOp:0) }) });
    if(wxTxt){ var st=frames[i]?frames[i].st:0; wxTxt.textContent=(rcfg.loop==='1'&&frames.length>1&&st)?('Radar · '+(st*10)+' min ago'):baseTxt } }
  function step(){ if(document.hidden||document.body.classList.contains('moving')||frames.length<2) return;
    var n=cur+1; if(n>=frames.length) n=0; setFrame(n); clearTimeout(tmr); tmr=setTimeout(step,n===frames.length-1?1800:650) }
  function applyRadar(){
    clearTimeout(tmr); clearFrames(); parked=false;
    ['rain','snow'].forEach(function(k){ var on=want('ca'); if(on&&!map.hasLayer(wxLayers[k])) wxLayers[k].addTo(map); if(!on&&map.hasLayer(wxLayers[k])) map.removeLayer(wxLayers[k]) });
    if(rcfg.src==='off'){ setFrame(0); return }
    var n=rcfg.loop==='1'?RSTEPS:1; for(var st=n-1;st>=0;st--) frames.push(buildFrame(st));
    setFrame(frames.length-1);
    if(frames.length>1) tmr=setTimeout(function(){ setFrame(0); tmr=setTimeout(step,650) },2500);
  }
  function loadRV(){ fetch('https://api.rainviewer.com/public/weather-maps.json').then(function(r){return r.json()}).then(function(j){
      var p=(j&&j.radar&&j.radar.past)||[]; if(!p.length) return; var t=p[p.length-1].time;
      if(t===rvStamp) return; rvStamp=t; rvPaths=p.map(function(x){return x.path}); applyRadar();
    }).catch(function(){}) }
  function radarTick(){ if(want('us')) applyRadar(); loadRV() }
  (function(){ var a=document.getElementById('radsrc'), b=document.getElementById('radloop'); if(!a||!b) return;
    a.value=rcfg.src; b.value=rcfg.loop;
    function save(){ try{localStorage.setItem('sky-radar',JSON.stringify(rcfg))}catch(e){} }
    a.onchange=function(){ rcfg.src=a.value; save(); applyRadar() };
    b.onchange=function(){ rcfg.loop=b.value; save(); applyRadar() };
  })();
  setTimeout(function(){applyRadar(); loadRV()},4000); setInterval(radarTick,300000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ loadRV(); if(frames.length>1){ clearTimeout(tmr); tmr=setTimeout(step,650) } } });
  map.on('moveend zoomend',function(){ if(frames.length>1){ clearTimeout(tmr); tmr=setTimeout(step,900) } });
  // While you pan or zoom, keep only the visible radar frame loaded; the rest return when you stop
  var parked=false, parkT=null;
  function parkRadar(){ if(parked||frames.length<2) return; parked=true; clearTimeout(tmr); frames.forEach(function(f,j){ if(j!==cur) ['rv','iem'].forEach(function(k){ if(f[k]) map.removeLayer(f[k]) }) }) }
  function unparkRadar(){ if(!parked) return; parked=false; frames.forEach(function(f,j){ if(j!==cur) ['rv','iem'].forEach(function(k){ if(f[k]) f[k].addTo(map) }) }); clearTimeout(tmr); tmr=setTimeout(step,1200) }
  map.on('zoomstart movestart',function(){ clearTimeout(parkT); parkRadar(); });
  map.on('zoomstart',function(){ document.body.classList.add('zooming') });
  map.on('zoomend',function(){ document.body.classList.remove('zooming'); document.body.classList.toggle('far',map.getZoom()<8) });
  map.on('moveend zoomend',function(){ clearTimeout(parkT); parkT=setTimeout(unparkRadar,1500) });
  map.whenReady(function(){ document.body.classList.toggle('far',map.getZoom()<8) });
  [].forEach.call(document.querySelectorAll('#fsheet details.folder'),function(d){ d.addEventListener('toggle',function(){ document.querySelector('#fsheet .sheet').classList.toggle('fopen',!!document.querySelector('#fsheet details.folder[open]')) }) });
  // Day / night map theme (Auto follows the sun at your location)
  var themeMode='day';
  try{var tmv=localStorage.getItem('sky-theme'); if(tmv==='day'||tmv==='night'||tmv==='auto') themeMode=tmv}catch(e){}
  function sunAlt(lat,lon,t){var D=Math.PI/180,n=t/86400000+2440587.5-2451545.0,Lm=(280.46+0.9856474*n)%360,g=((357.528+0.9856003*n)%360)*D,lam=(Lm+1.915*Math.sin(g)+0.02*Math.sin(2*g))*D,eps=23.439*D,dec=Math.asin(Math.sin(eps)*Math.sin(lam)),ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),gm=(18.697374558+24.06570982441908*n)%24,ha=(gm*15+lon)*D-ra;return Math.asin(Math.sin(lat*D)*Math.sin(dec)+Math.cos(lat*D)*Math.cos(dec)*Math.cos(ha))/D}
  function applyTheme(){var night=themeMode==='night'||(themeMode==='auto'&&sunAlt(me.lat,me.lon,Date.now())<-1); document.getElementById('map').classList.toggle('night',night)}
  (function(){var sel=document.getElementById('maptheme'); if(sel){sel.value=themeMode; sel.onchange=function(){themeMode=sel.value;try{localStorage.setItem('sky-theme',themeMode)}catch(e){} applyTheme()}} })();
  applyTheme(); setInterval(applyTheme,300000);
  // one Settings folder open at a time so the sheet stays on one screen
  [].forEach.call(document.querySelectorAll('#fsheet details.folder'),function(d){ d.addEventListener('toggle',function(){ if(d.open) [].forEach.call(document.querySelectorAll('#fsheet details.folder'),function(o){ if(o!==d) o.open=false }) }) });

  // Location dot with a soft red halo
  var meMark = L.marker([me.lat,me.lon],{icon:L.divIcon({className:'me',html:'<i></i>',iconSize:[34,34],iconAnchor:[17,17]}),interactive:false,keyboard:false,zIndexOffset:-500}).addTo(map);
  var meHalo = {setLatLng:function(){return meHalo}};
  var ring = L.circle([me.lat,me.lon],{radius:radiusNm*1852,color:'#ff3b30',weight:1.5,opacity:.6,fill:false,dashArray:'5 7',interactive:false}).addTo(map);

  function syncLabels(){document.getElementById('map').classList.toggle('nolabels',map.getZoom()<7)}
  map.on('zoomend',syncLabels);
  function syncRing(){var el=ring.getElement&&ring.getElement(); if(el) el.style.display=map.getZoom()>=10?'none':''}
  map.on('zoomend',syncRing); map.whenReady(syncRing);
  map.on('movestart zoomstart',function(){document.body.classList.add('moving')});
  map.on('moveend zoomend',function(){document.body.classList.remove('moving')});
  var pre={}, preT=0;
  function preloadNear(){
    if(navigator.connection&&navigator.connection.saveData) return;
    var z=map.getZoom(); if(z!==Math.round(z)) return;
    var bb=map.getBounds().pad(.3), n=0, cnt=0; for(var k in pre) cnt++; if(cnt>1500) pre={};
    [z+1,z-1].forEach(function(zz){
      n=0;
      if(zz<map.getMinZoom()||zz>map.getMaxZoom()) return;
      baseLayers.forEach(function(lay){
        if(!lay.getTileUrl||!map.hasLayer(lay)) return;
        var nz=Math.min(zz,lay.options.maxNativeZoom||zz), sz=1<<nz;
        var nw=map.project(bb.getNorthWest(),nz).divideBy(256).floor(), se=map.project(bb.getSouthEast(),nz).divideBy(256).floor();
        for(var x=nw.x;x<=se.x&&n<48;x++) for(var y=nw.y;y<=se.y&&n<48;y++){
          if(y<0||y>=sz) continue;
          var u=lay.getTileUrl({x:((x%sz)+sz)%sz,y:y,z:nz}); if(pre[u]) continue; pre[u]=1; n++; (new Image()).src=u;
        }
      });
    });
  }
  function schedulePreload(){clearTimeout(preT); preT=setTimeout(preloadNear,1800)}
  map.on('moveend zoomend',schedulePreload); map.whenReady(function(){setTimeout(preloadNear,1500)});

    var b0=wrap(map.getBearing()), t0=performance.now(), dur=350;
    if(Math.abs(b0)<0.5){map.setBearing(0);return}
    resetting=true; mapEl.parentNode.classList.remove('glide');
    (function step(now){
      var k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      map.setBearing(b0*(1-e));
      if(k<1) requestAnimationFrame(step); else {map.setBearing(0);resetting=false;mapEl.parentNode.classList.add('glide')}
    })(t0);
  }
  document.getElementById('compass').onclick=resetNorth;
  // planes keep pointing the way they fly: update the angle the instant the map turns (touch twist, tap-to-north, anything)
  function syncBearing(){var bb=map.getBearing?map.getBearing():0; if(typeof bb==='number'&&bb===bb) mapEl.style.setProperty('--bearing',bb+'deg')}
  map.on('rotate',syncBearing); syncBearing();
  (function(){
    var K='sky-compass', cfg={cread:'1',cshow:'1',cspin:'55'};
    try{var r=JSON.parse(localStorage.getItem(K)||'{}');for(var k in cfg) if(r[k]!=null) cfg[k]=String(r[k])}catch(e){}
    function apply(){
      document.getElementById('compass').hidden=cfg.cshow==='0';
      hdgEl.hidden=cfg.cread==='0';
      tau=+cfg.cspin||55;
    }
    ['cread','cshow','cspin'].forEach(function(id){
      var el=document.getElementById(id); el.value=cfg[id];
      el.onchange=function(){cfg[id]=el.value;try{localStorage.setItem(K,JSON.stringify(cfg))}catch(e){}apply()};
    });
    document.getElementById('cnorth').onclick=resetNorth;
    apply();
  })();
  requestAnimationFrame(compassTick);

  function setStat(text,err){
    document.getElementById('stat').innerHTML='<i class="live'+(err?' err':'')+'"></i>'+text;
  }

  function age(p){return p.seen_pos!=null?p.seen_pos:(p.seen!=null?p.seen:99)}
  function merge(lists){
    var byHex={};
    lists.forEach(function(list){
      list.forEach(function(p){
        if(p.lat==null||p.lon==null||!p.hex) return;
        var old=byHex[p.hex];
        if(!old){byHex[p.hex]=p;return}
        var win=age(p)<age(old)?p:old, lose=win===p?old:p;
        Object.keys(lose).forEach(function(k){if(win[k]==null&&lose[k]!=null)win[k]=lose[k]});
        byHex[p.hex]=win;
      });
    });
    return Object.keys(byHex).map(function(h){return byHex[h]});
  }
  // Optional relay: a small server you own that adds the permission header browsers require. Empty means call the feeds directly.
  var relay='', apiKey='';
  // Personal FlyItalyADSB key, used until you paste a different one on the Feeds screen. Empty in the website build.
  var DEFAULT_KEY='';
  try{relay=localStorage.getItem('sky-relay')||'';apiKey=localStorage.getItem('sky-key')||''}catch(e){}
  var DEFAULT_RELAY=''; if(!relay) relay=DEFAULT_RELAY;
  try{var qrl=new URLSearchParams(location.search).get('relay'); if(qrl&&/^https:\/\/[^\s"'<>]+$/.test(qrl)){ if(confirm('Use this relay for flight data?\n'+qrl)){relay=qrl;localStorage.setItem('sky-relay',qrl)} history.replaceState(null,'',location.pathname) }}catch(e){}
  if(!apiKey) apiKey=DEFAULT_KEY;
  function active(){return SOURCES.filter(function(s){return s.needsKey?!!apiKey:!!relay})}
  function viaRelay(u){return relay?relay+(relay.indexOf('?')>-1?'&':'?')+'u='+encodeURIComponent(u):u}
  function query(){
    var c=map.getCenter(), b=map.getBounds(), view=distNm(c.lat,c.lng,b.getNorthEast().lat,b.getNorthEast().lng), home=distNm(me.lat,me.lon,c.lat,c.lng)<5;
    var r=Math.max(view,home?radiusNm:0); r=Math.max(25,Math.min(250,Math.ceil(r)));
    return {lat:(home?me.lat:c.lat).toFixed(4),lon:(home?me.lon:c.lng).toFixed(4),r:r};
  }
  function fetchSource(s){
    var Q=query(), u=s.url(Q.lat,Q.lon,Q.r);
    return fetch(s.needsKey?u:viaRelay(u),s.needsKey?{headers:{'X-Api-Key':apiKey}}:undefined)
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .then(function(j){return {ok:true,ac:j.ac||j.aircraft||[]}})
      .catch(function(e){return {ok:false,err:e&&e.message}});
  }
  function showWelcome(mode){
    var w=document.getElementById('welcome'); if(!w) return;
    if(!mode){w.hidden=true;return}
    var T={setup:['Welcome to Sky Overhead','To see live planes the app needs a free flight-feed key. It takes about a minute.','Set up feeds'],
      error:['Can\u2019t reach the feeds','Check your connection, or open Settings to fix your key.','Open Settings'],
      empty:['No planes nearby','Nothing in range right now. Zoom out, or raise the search radius in Settings.','']}[mode];
    document.getElementById('wtitle').textContent=T[0]; document.getElementById('wtext').textContent=T[1];
    var b=document.getElementById('wbtn'); b.textContent=T[2]; b.onclick=function(){openSheet()};
    w.className='welcome'+(mode==='empty'?' soft':''); w.hidden=false;
  }
  function poll(){
    if(busy||document.hidden) return schedule();
    busy=true;
    var on=active();
    if(!on.length){busy=false;showWelcome('setup');setStat('Needs a feed<br>tap to set up',true);return schedule()}
    return Promise.all(on.map(fetchSource)).then(function(res){
      var good=res.filter(function(r){return r.ok});
      if(!good.length){
        failCount++; if(failCount>1) showWelcome('error');
        var code=res.map(function(r){return r.err}).filter(function(c){return /^\d+$/.test(c||'')})[0];
        setStat(!navigator.onLine?'No internet<br>check connection':(failCount>1?'Feed error<br>tap for fix':'Connecting…'),true);
        return;
      }
      failCount=0;
      lastData=merge(good.map(function(r){return r.ac}));
      render(lastData); showWelcome(lastData.length?false:'empty');
      var t=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});
      var warn=good.length<on.length?' · '+good.length+'/'+on.length:'';
      setStat('<em>'+Math.min(lastData.length,maxPlanes)+((Math.min(lastData.length,maxPlanes))===1?' plane':' planes')+'</em><br>'+t+warn, good.length<on.length);
    }).then(function(){busy=false;schedule()});
  }
  function schedule(){clearTimeout(timer);timer=setTimeout(poll,refreshMs);
    document.getElementById('map').parentNode.style.setProperty('--glide',(refreshMs/1000)+'s');}
  document.addEventListener('visibilitychange',function(){if(!document.hidden){clearTimeout(timer);poll()}});
  var movT=null;
  map.on('moveend',function(){clearTimeout(movT);movT=setTimeout(function(){if(!busy&&!document.hidden){clearTimeout(timer);poll()}},700)});
  map.on('zoomstart movestart',function(){document.getElementById('map').parentNode.classList.remove('glide')});
  map.on('zoomend moveend',function(){document.getElementById('map').parentNode.classList.add('glide')});
  var rate=document.getElementById('rate');
  try{var saved=localStorage.getItem('sky-refresh');if(saved&&rate.querySelector('[value="'+saved+'"]'))refreshMs=+saved}catch(e){}
  rate.value=String(refreshMs);
  rate.onchange=function(){refreshMs=+rate.value;try{localStorage.setItem('sky-refresh',rate.value)}catch(e){}clearTimeout(timer);poll()};
  document.getElementById('map').parentNode.classList.add('glide');

  var touched=false;
  ['pointerdown','wheel','touchstart'].forEach(function(ev){document.getElementById('map').addEventListener(ev,function(){touched=true},{passive:true})});
  function recenter(keep){
    meMark.setLatLng([me.lat,me.lon]); meHalo.setLatLng([me.lat,me.lon]); loadTemp(); ring.setLatLng([me.lat,me.lon]).setRadius(radiusNm*1852);
    if(!keep) map.fitBounds(ring.getBounds(),{padding:[10,10]});
    Object.keys(trails).forEach(function(h){trails[h].pts=[]});
    poll();
  }

  document.getElementById('radius').onchange=function(e){
    radiusIdx=+e.target.value;
    radiusNm=units==='av'?RADII.av[radiusIdx]:RADII.metric[radiusIdx]/1.852;
    try{localStorage.setItem('sky-radius',String(radiusIdx))}catch(err){}
    recenter();
  };
  document.getElementById('units').onchange=function(e){
    units=e.target.value==='metric'?'metric':'av';
    try{localStorage.setItem('sky-units',units)}catch(err){}
    applyUnits(); recenter(); render(lastData);
  };
  function locate(auto){
    if(!navigator.geolocation){setStat('No location<br>using default');return}
    navigator.geolocation.getCurrentPosition(function(pos){
      me.lat=pos.coords.latitude; me.lon=pos.coords.longitude; me.label='you'; recenter(auto===true&&touched);
    },function(){setStat('Location off<br>using default',true)},{enableHighAccuracy:false,timeout:10000,maximumAge:300000});
  }
  document.getElementById('locate').onclick=function(){locate(false)};

  // Feed check: calls every feed once and explains what happened in plain words.
  function probe(s){
    if(s.needsKey&&!apiKey) return Promise.resolve({ok:false,text:'Add your free key below to use this feed.'});
    var t0=performance.now(), u=s.needsKey?s.url(me.lat.toFixed(4),me.lon.toFixed(4),Math.round(radiusNm)):viaRelay(s.url(me.lat.toFixed(4),me.lon.toFixed(4),Math.round(radiusNm)));
    return fetch(u,s.needsKey?{headers:{'X-Api-Key':apiKey}}:undefined).then(function(r){
      var ms=Math.round(performance.now()-t0);
      if(r.status===401||r.status===403) return {ok:false,text:s.needsKey?'The key was not accepted. Check that you pasted it in full.':'The server refused the request (error '+r.status+').'};
      if(!r.ok) return {ok:false,text:'The server answered with error '+r.status+'.'};
      return r.json().then(function(j){return {ok:true,text:'Working · '+(j.ac||j.aircraft||[]).length+((j.ac||j.aircraft||[]).length===1?' plane':' planes')+' · '+ms+' ms'}});
    }).catch(function(){
      if(!navigator.onLine) return {ok:false,text:'No internet connection.'};
      return fetch(u,{mode:'no-cors'}).then(function(){
        return {ok:false,blocked:true,text:'Needs a relay to be read.'};
      }).catch(function(){return {ok:false,text:'Could not connect to this server.'}});
    });
  }
  function runTest(){
    var list=document.getElementById('flist'), help=document.getElementById('fhelp');
    list.innerHTML=SOURCES.map(function(s){return '<div class="frow" data-id="'+s.id+'"><b>'+s.id+'<em>Testing…</em></b></div>'}).join('');
    help.textContent='';
    Promise.all(SOURCES.map(probe)).then(function(res){
      var good=0,blocked=0;
      res.forEach(function(r,i){
        if(r.ok) good++; if(r.blocked) blocked++;
        list.children[i].innerHTML='<b>'+SOURCES[i].id+'<em class="'+(r.ok?'ok':'no')+'" style="font-style:normal">'+(r.ok?'OK':'Not working')+'</em></b><span'+(r.blocked?' class="rb"':'')+'>'+esc(r.text)+'</span>';
      });
      help.textContent=good?'At least one feed is working. adsb.lol, adsb.fi, adsb.one and airplanes.live need a relay because they do not let web pages read them.':
        (blocked||!apiKey?'Get a free FlyItalyADSB key (it is emailed to you, no approval) and paste it below. adsb.lol, adsb.fi, adsb.one and airplanes.live only work through a relay.':'Check your connection and try again.');
    });
  }
  function envLine(){
    var how=location.protocol==='file:'||location.protocol==='content:'?'saved file':(/^https?:$/.test(location.protocol)?'web page':'preview');
    document.getElementById('fenv').textContent='Opened as: '+how+' · Internet: '+(navigator.onLine?'connected':'offline')+(how==='preview'?' · Previews inside other apps often block the internet. Open the saved file in Chrome.':'');
  }
  function openSheet(){
    envLine();document.getElementById('relay').value=relay;document.getElementById('apikey').value=apiKey;document.getElementById('fsheet').hidden=false;
    var ff=document.getElementById('ffolder'), want=!active().length||failCount>0;
    if(want){ if(ff.open) runTest(); else ff.open=true } else ff.open=false;
  }
  document.getElementById('ffolder').addEventListener('toggle',function(){ if(this.open) runTest() });
  document.getElementById('stat').onclick=openSheet;
  document.getElementById('gear').onclick=openSheet;
  document.getElementById('stat').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openSheet()}};
  document.getElementById('fclose').onclick=function(){document.getElementById('fsheet').hidden=true};
  document.getElementById('ftest').onclick=function(e){e.preventDefault();runTest()};
  document.getElementById('fsave').onclick=function(e){
    e.preventDefault();
    relay=document.getElementById('relay').value.trim();
    apiKey=document.getElementById('apikey').value.trim();
    try{localStorage.setItem('sky-relay',relay);localStorage.setItem('sky-key',apiKey)}catch(err){}
    runTest(); clearTimeout(timer); busy=false; poll();
  };
  applyUnits(); syncLabels(); recenter(); locate(true);
  if(!active().length) setTimeout(openSheet,600);
  // Works as an installable app once the page is hosted on https
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
