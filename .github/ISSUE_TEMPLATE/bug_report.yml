name: Bug report
description: Something in AwareBC isn't working right
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please hide your location, rider tag and any private details in screenshots.
        **Security problem?** Don't post it here. Email awarebc.help@gmail.com (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I opened Layers, turned on Ferries, and the map went blank.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - On-road
        - Off-road
        - Both
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you using AwareBC?
      options:
        - Android app
        - Phone browser
        - Computer browser
        - iPhone browser
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or computer
      placeholder: Samsung A32, Android 13
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings ▸ App updates
      placeholder: v312
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or crash report
      description: Drag images here. Crash reports are sent to us automatically unless you turned them off (Settings ▸ Account).
