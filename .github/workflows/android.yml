# AwareBC Android app (by Josh Singer): every change to the website builds a fresh test app.
# Download it on your phone: https://github.com/SinKid420/Singer-Flight-Tracker/releases/download/android-test/AwareBC.apk
name: Android app
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'reports-server/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Make the app files from the website
        run: node app/prep.mjs web
      - name: Add Capacitor and Android
        working-directory: app/build
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node ../prep.mjs android
          npx cap sync android
      - name: Build the app
        working-directory: app/build/android
        env:
          TEST_KEY: 
        run: |
          # test-only signing key (kept the same so each new test app installs over the last). The Play Store app will use a private key.
          mkdir -p ~/.android && echo "$TEST_KEY" | base64 -d > ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/AwareBC.apk
      - name: Publish the test app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "AwareBC test app" --notes "Test app for Android. Tap AwareBC.apk on your phone to install."
          gh release upload android-test AwareBC.apk --clobber
          gh release edit android-test --notes "Test app for Android, build ${{ github.run_number }}. Tap AwareBC.apk on your phone to install."
